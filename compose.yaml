services:
  db:
    image: postgres:17-alpine
    container_name: spd-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spd}
      POSTGRES_DB: ${POSTGRES_DB:-spd_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-spd} -d $${POSTGRES_DB:-spd_dev}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
