[project]
name = "spd"
version = "0.1.0"
description = "Student Progress Dashboard API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=23.1.0",
    "fastapi>=0.143.2",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.10.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.40.0",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.6.0",
    "faker>=40.43.0",
    "httpx>=0.28.1",
    "mypy>=1.18.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "testcontainers[postgres]>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spd"]

# ── ruff ─────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["spd"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migrations may emit long constraint strings.
"migrations/versions/*.py" = ["E501"]

# ── mypy ─────────────────────────────────────────────────────────────

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

# ── pytest ───────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-config", "--strict-markers", "-q", "-m", "not integration"]
markers = [
    "integration: needs a real PostgreSQL (testcontainers); deselected by default",
]
filterwarnings = [
    # Starlette's TestClient deprecates httpx in favour of httpx2; silenced
    # until FastAPI ships first-class support for it.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

# ── coverage ─────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["spd"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
