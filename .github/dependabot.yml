version: 2

updates:
  # Python (uv.lock + pyproject.toml)
  - package-ecosystem: uv
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Node (pnpm-lock.yaml + package.json)
  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      node-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript majors need a deliberate tsconfig migration (baseUrl deprecation).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types must track the Node runtime (nodejs_24), not the latest Node major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Pinned in lockstep with the Nix playwright-driver browser bundle.
      - dependency-name: "@playwright/test"
      # Keep ESLint plugin majors deliberate alongside the ESLint major.
      - dependency-name: typescript-eslint
        update-types: ["version-update:semver-major"]

  # GitHub Actions used by the CI workflow
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  # Nix flake inputs (flake.lock)
  - package-ecosystem: nix
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nix-inputs:
        patterns: ["*"]
